name: build-publish-all
run-name: Build and publish artifacts
on: [workflow_dispatch]
permissions:
  contents: write
jobs:
  build_macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        run: rustup update stable

      - name: Build macOS GUI and CLI
        run: cargo build --release

      - name: Upload macOS artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos-artifact
          path: |
            target/release/Sam
            target/release/sam-cli
          retention-days: 1

  create_release:
    runs-on: macos-latest
    needs: [ build_macos ]
    steps:
      - name: Download macOS Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: macos-artifact
          path: ./release_artifacts/macos

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## Release Notes for ${{ github.ref_name }}

            This release includes:
            - macOS GUI
            - sam-cli
            - Built on ${{ github.sha }}

          draft: true
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            release_artifacts/macos/Sam
            release_artifacts/macos/sam-cli
