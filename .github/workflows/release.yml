name: release
run-name: Release
on:
  push:
    branches: [master]
permissions:
  contents: write
  pull-requests: write
jobs:
  release_please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          config-file: release-config.json
          manifest-file: release-manifest.json

  build_macos:
    needs: [ release_please ]
    if: needs.release_please.outputs.release_created == 'true'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: amd64
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release_please.outputs.tag_name }}

      - name: Install Rust toolchain
        run: |
          rustup update stable
          rustup target add ${{ matrix.target }}

      - name: Build macOS GUI and CLI
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Set sam-tui icon
        run: target/set-icon "target/${{ matrix.target }}/release/sam-tui" assets/icon_256.png

      - name: Upload binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release_please.outputs.tag_name }}
        run: |
          version="${TAG#v}"
          out="target/${{ matrix.target }}/release"
          archive="sam_${version}_darwin_${{ matrix.arch }}.tar.gz"
          stage="$(mktemp -d)"
          scripts/make-app.sh "$out/sam" "$stage" "$version"
          cp -p "$out/sam-tui" LICENSE README.md "$stage/"
          tar -czf "$archive" -C "$stage" Sam.app sam-tui LICENSE README.md
          gh release upload "$TAG" "$archive" --clobber

  checksums:
    needs: [ release_please, build_macos ]
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release_please.outputs.tag_name }}

      - name: Upload checksums.txt
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release_please.outputs.tag_name }}
        run: |
          gh release download "$TAG" --pattern 'sam_*_darwin_*.tar.gz'
          shasum -a 256 sam_*_darwin_*.tar.gz > checksums.txt
          cat checksums.txt
          gh release upload "$TAG" checksums.txt --clobber

      - name: Add install instructions to the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release_please.outputs.tag_name }}
        run: |
          body="$(gh release view "$TAG" --json body --jq .body)"
          if ! grep -q '^## Install$' <<<"$body"; then
            printf '%s\n\n%s\n' "$body" "$(cat .github/release-notes.md)" > notes.md
            gh release edit "$TAG" --notes-file notes.md
          fi

  homebrew:
    needs: [ release_please, checksums ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release_please.outputs.tag_name }}

      - name: Update the formula in luisitoluis/homebrew-tap
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ needs.release_please.outputs.tag_name }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; skipping the Homebrew formula update."
            exit 0
          fi
          gh release download "$TAG" --pattern checksums.txt
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/luisitoluis/homebrew-tap.git" tap
          mkdir -p tap/Formula
          scripts/render-formula.sh "$TAG" checksums.txt tap/Formula
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/sam.rb Formula/sam-tui.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date."
          else
            git commit -m "sam and sam-tui ${TAG#v}"
            git push
          fi
