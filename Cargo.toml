[package]
name = "Sam"
version = "1.0.0"
description = "Steam Achievement Manager Rewritten"
edition = "2024"
authors = [
    "Paul <abonnementspaul -@- gmail.com>",
    "Phillip <phillip.mendel -@- posteo.de>",
    "All SamRewritten contributors"
]

[dependencies]
eframe = { version = "0.36", optional = true }
egui_extras = { version = "0.36", features = ["image"], optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"], optional = true }
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.29", optional = true }
ratatui-image = { version = "11", default-features = false, features = ["crossterm"], optional = true }
quick-xml = { version = "0", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0", features = ["blocking"] }
interprocess = "2"
libloading = "0"

[features]
default = ["gui", "cli"]
gui = ["dep:eframe", "dep:egui_extras", "dep:image"]
cli = ["dep:ratatui", "dep:crossterm", "dep:ratatui-image", "dep:image"]

[lib]
name = "sam"
path = "src/lib.rs"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0"

[profile.release]
lto = "thin"

[[bin]]
name = "Sam"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "sam-tui"
path = "src/bin/sam-tui.rs"
required-features = ["cli"]
