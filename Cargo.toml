[package]
name = "SamRewritten"
version = "1.2.3"
description = "Steam Achievement Manager Rewritten"
edition = "2024"
authors = [
    "Paul <abonnementspaul -@- gmail.com>",
    "Phillip <phillip.mendel -@- posteo.de>",
    "All SamRewritten contributors"
]

[dependencies]
clap = { version = "4", features = ['derive'], optional = true }
eframe = { version = "0.36", optional = true }
quick-xml = { version = "0", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0", features = ["blocking"] }
interprocess = "2"
libloading = "0"

[features]
default = ["gui"]
gui = ["dep:eframe"]
cli = ["dep:clap"]

[target.'cfg(windows)'.dependencies]
winreg = "0"

[target.'cfg(windows)'.build-dependencies]
winres = "0"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0"

[profile.release]
lto = "thin"

[[bin]]
name = "samrewritten"
path = "src/main.rs"
